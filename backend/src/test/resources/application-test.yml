app:
  jwt:
    # Секрет только для тестов. Продуктовый приходит из переменной окружения.
    secret: test-only-secret-0123456789abcdef0123456789abcdef
    issuer: notescout-api-test
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  rate-limit:
    # По умолчанию выключен, чтобы тесты не упирались в лимит.
    # Включается точечно через @TestPropertySource.
    enabled: false
  attachments:
    # Каталог сборки, а не системный временный: файлы переживают прогон,
    # поэтому падение теста можно разобрать руками. build/ в репозиторий
    # не попадает, а ключи вложений — uuid, так что прогоны не мешают друг другу.
    directory: build/test-attachments
    # Небольшие пределы: проверять отказ по размеру на десяти мегабайтах
    # пришлось бы, заливая десять мегабайт.
    max-file-size: 1KB
    max-total-per-user: 3KB

logging:
  level:
    root: WARN
    com.notescout: INFO
    org.testcontainers: WARN
    com.github.dockerjava: WARN
