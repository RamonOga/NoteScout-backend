spring:
  application:
    name: notescout-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notescout}
    username: ${DB_USER:notescout}
    password: ${DB_PASSWORD:notescout}
    hikari:
      pool-name: notescout-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 10000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      # Схемой управляет исключительно Flyway.
      # Переключите на "validate", когда убедитесь, что маппинг полностью совпадает
      # со схемой — это ловит расхождения на старте приложения.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 30
        default_batch_fetch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Приложение стоит за Caddy — доверяем заголовкам X-Forwarded-*.
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

app:
  jwt:
    # ОБЯЗАТЕЛЬНАЯ переменная. Приложение не стартует с пустым/коротким секретом.
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:notescout-api}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:30d}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-capacity: ${RATE_LIMIT_AUTH_CAPACITY:10}
    auth-window: ${RATE_LIMIT_AUTH_WINDOW:1m}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: notescout-api

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  default-produces-media-type: application/json

logging:
  level:
    root: INFO
    com.notescout: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{40} - %msg%n"
