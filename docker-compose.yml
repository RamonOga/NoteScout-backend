# ============================================================================
#  NoteScout — продуктовый стек для одного VPS.
#
#  Запуск:   cp .env.example .env && ${EDITOR:-vi} .env
#            docker compose up -d --build
#  Логи:     docker compose logs -f api
#  Останов:  docker compose down            (данные сохраняются в томах)
# ============================================================================
name: notescout

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-UTC}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -q"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # Порт наружу НЕ публикуется: БД доступна только внутри docker-сети.
    networks: [internal]

  api:
    build:
      context: ./backend
    image: notescout/api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-notescout-api}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_AUTH_CAPACITY: ${RATE_LIMIT_AUTH_CAPACITY:-10}
      RATE_LIMIT_AUTH_WINDOW: ${RATE_LIMIT_AUTH_WINDOW:-1m}
      TZ: ${TZ:-UTC}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health/readiness >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports:
      # Порт 80 на этой площадке занят nginx с Zabbix, поэтому публикуем только
      # 443: сертификат выпускается проверкой TLS-ALPN-01, ей порт 80 не нужен.
      # Когда 80 освободится, верните сюда "80:80" — редирект на HTTPS уже
      # подготовлен в Caddyfile.
      - "443:443"
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

  backup:
    build:
      context: ./ops/backup
    image: notescout/backup:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Схему создаёт API миграциями Flyway при старте. Без этой зависимости
      # копия по BACKUP_ON_START снималась бы с базы, где таблиц ещё нет,
      # и оказывалась дампом пустой базы.
      api:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
      BACKUP_ON_START: ${BACKUP_ON_START:-false}
      RETENTION_DAILY: ${RETENTION_DAILY:-7}
      RETENTION_WEEKLY: ${RETENTION_WEEKLY:-4}
      RETENTION_MONTHLY: ${RETENTION_MONTHLY:-12}
      TZ: ${TZ:-UTC}
      S3_REMOTE: ${S3_REMOTE:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-notescout}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - backups:/backups
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  backups:
  caddy_data:
  caddy_config:
